# Keeps podcast.html in step with the podcast feed so Google sees new episodes.
# Every day it reads the RSS feed (the one Spotify for Creators publishes to),
# rewrites the saved episode list and podcast data in podcast.html, and saves
# the change only if there is a new or edited episode.
name: Update podcast episodes

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC (6:17 am Toronto in winter, 7:17 am in summer)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the episode list from the feed
        run: python3 build-podcast.py

      - name: Save the change if there is one
        run: |
          if git diff --quiet -- podcast.html; then
            echo "No new episodes."
            exit 0
          fi
          python3 - <<'EOF'
          import pathlib, datetime
          p = pathlib.Path("sitemap.xml"); t = p.read_text()
          i = t.index("podcast.html"); j = t.index("<lastmod>", i) + 9
          p.write_text(t[:j] + datetime.date.today().isoformat() + t[j + 10:])
          EOF
          git config user.name "podcast-updater"
          git config user.email "podcast-updater@users.noreply.github.com"
          git add podcast.html sitemap.xml
          git commit -m "Update podcast episodes from the feed"
          git push
