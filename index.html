<body class="bg-amber-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icon Wrapper to handle Lucide in browser
        const Icon = ({ name, size = 24, className }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // Icon Components mapping
        const BookOpen = (props) => <Icon name="book-open" {...props} />;
        const Mic = (props) => <Icon name="mic" {...props} />;
        const PenTool = (props) => <Icon name="pen-tool" {...props} />;
        const Mail = (props) => <Icon name="mail" {...props} />;
        const Heart = (props) => <Icon name="heart" {...props} />;
        const ArrowRight = (props) => <Icon name="arrow-right" {...props} />;
        const Menu = (props) => <Icon name="menu" {...props} />;
        const X = (props) => <Icon name="x" {...props} />;
        const Instagram = (props) => <Icon name="instagram" {...props} />;
        const Linkedin = (props) => <Icon name="linkedin" {...props} />;
        const ExternalLink = (props) => <Icon name="external-link" {...props} />;
        const Play = (props) => <Icon name="play" {...props} />;

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            
            // Default fallback articles
            const defaultArticles = [
                {
                title: "Toxic Employees Are Contagious",
                link: "https://medium.com/@msjag416/toxic-employees-are-contagious-how-one-person-can-wreck-a-whole-workplace-765430ce9376",
                thumbnail: null,
                description: "Discover how negativity spreads in healthcare environments and what leaders can do to stop the infection before it spreads..."
                },
                {
                title: "Unmasking the Truth",
                link: "https://medium.com/@msjag416/frontline-reflections-navigating-ppe-challenges-burnout-and-resilience-among-nurses-during-the-8347dabdc1a7",
                thumbnail: null,
                description: "Navigating PPE challenges, burnout, and resilience among nurses during the most challenging times..."
                },
                {
                title: "Why Gen Z Nurses Push Back",
                link: "https://medium.com/@msjag416/gen-z-nurses-and-workplace-criticism-are-they-pushing-back-or-just-pushing-for-respect-a786565027bb",
                thumbnail: null,
                description: "A new generation is changing the rules of nursing. Here is why their boundaries are exactly what the profession needs..."
                }
            ];

            const [articles, setArticles] = useState(defaultArticles);

            // Helper to strip HTML tags
            const stripHtml = (html) => {
                let tmp = document.createElement("DIV");
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || "";
            };

            // Helper to find image
            const findImageInContent = (content) => {
                const div = document.createElement('div');
                div.innerHTML = content;
                const img = div.querySelector('img');
                return img ? img.src : null;
            };

            // Fetch Medium Articles
            useEffect(() => {
                fetch('https://api.rss2json.com/v1/api.json?rss_url=https://medium.com/feed/@msjag416')
                .then((res) => res.json())
                .then((data) => {
                    if (data.status === 'ok' && data.items.length > 0) {
                    const formattedArticles = data.items.slice(0, 3).map(item => {
                        let image = item.thumbnail;
                        if (!image) {
                            image = findImageInContent(item.description || item.content);
                        }

                        return {
                        title: item.title,
                        link: item.link,
                        thumbnail: image,
                        description: stripHtml(item.description).substring(0, 120) + "..."
                        };
                    });
                    setArticles(formattedArticles);
                    }
                })
                .catch((error) => {
                    console.error("Error fetching Medium articles:", error);
                });
            }, []);

            // Navbar scroll effect
            useEffect(() => {
                const handleScroll = () => {
                setScrolled(window.scrollY > 20);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const toggleMenu = () => setIsMenuOpen(!isMenuOpen);

            const scrollToSection = (e, id) => {
                e.preventDefault();
                setIsMenuOpen(false);
                const element = document.getElementById(id);
                if (element) {
                const headerOffset = 80;
                const elementPosition = element.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: "smooth"
                });
                }
            };

                        <span className="font-serif text-xl font-bold tracking-tight text-stone-900">

                        </div>

                            B2B
